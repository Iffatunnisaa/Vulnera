# /etc/fail2ban/filter.d/vulnera-auth.conf
# Filter untuk mendeteksi percobaan login yang gagal pada aplikasi Vulnera

[Definition]

# Regex (Regular Expression) untuk mencocokkan baris log.
# <HOST> adalah placeholder khusus Fail2Ban yang akan menangkap alamat IP.
# Pola di bawah ini cocok dengan log yang dihasilkan oleh Winston.
failregex = ^.*WARN: Failed login attempt.*from IP <HOST>$
